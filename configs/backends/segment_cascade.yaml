name: cascade
protocol: SegmentBackend
# Order is sequential. Do not run character cut / Tagger / DINO / SAM in parallel.
character: anime_segmentation
character_size: 1024
tagger: wdtagger
boxes: grounding_dino
mask: sam3.text
mask_fallback: sam2.hinted
max_attempts: 4
dino_threshold: 0.25
tag_threshold: 0.35
