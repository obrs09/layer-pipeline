schema: layerforge.config.v1

normalize:
  max_side: 2048

segment:
  name: auto

cascade:
  max_attempts: 4
  character: anime_segmentation
  pose: dwpose
  pose_score: 0.3
  pose_dilate_px: 72
  tagger: wdtagger
  boxes: grounding_dino
  mask: sam3.text
  mask_fallback: sam2.hinted
  dino_threshold: 0.25
  tag_threshold: 0.35
  character_size: 1024
  hair_reach: 0.6
  # Residual hair must touch the head zone. Wrist discs split held props off that blob.
  hair_punch_pose_roles: [arm_l, arm_r]
  hair_punch_pose_pad: 48
  # Figure is character minus head and accessories. Clothes and arms stay inside it.
  figure_body:
    enabled: true
    keep: [clothes, arm_l, arm_r]
    punch: [hair_back, hair_front, face, eye_l, eye_r, mouth, neck, acc]
  # Small parts: DINO box → pad → upscale → SAM2 on the crop → remap.
  sam_crop:
    enabled: true
    roles: [face]
    pad_frac: 0.18
    min_side: 1024
  # Hair SAM hints: peek a face box first, seed on hair, never the face center.
  hair_hint:
    enabled: true
    face_dilate_px: 8
    drop_skin: true
  # After whole-hair SAM, cut front and back inside that mask. Occlusion/depth/parsing stay off.
  hair_parts:
    enabled: true
    front_queries: ["front hair", "bangs"]
    back_queries: ["back hair"]
    min_px: 32
    max_whole_frac: 0.85
  hair_split:
    enabled: false
    strategy: occlusion
    compare: true
    peel_back: false
    min_front_px: 32
    occlusion:
      forehead_frac: 0.42
      bangs_up_frac: 0.35
      grow_px: 16
      barrier_dilate_px: 2
    depth:
      enabled: true
      allow_hub: true
      eps: 0.10
      sam_refine: false
    parsing:
      enabled: true
      erode_px: 8
      pos_points: 6
      neg_points: 4
      sam_refine: true
  # Off: Lab/grow/edge peel of hair from the SAM face did more harm than good.
  face_split:
    enabled: false
    expand_px: 1
    punch_roles: [eye_l, eye_r, mouth]
    neck_role: neck
    hair_role: hair_front
    hair_fallback: hair_back
    cut_neck: false
    l_weight: 0.08
    jaw_frac: 0.82
    jaw_pad_px: 4
    neck_width_frac: 0.62
    skin_dist: 24
    hair_dist: 24
    hair_slack: 8
    skin_mode: grow
    local_dist: 20
    edge_stop: true
    canny_low: 50
    canny_high: 120
    min_neck_px: 64
    min_hair_px: 32
    cheek_dilate_px: 24

character_qa:
  max_attempts: 3
  min_largest_frac: 0.60
  max_components: 15
  min_component_px: 50
  gray_lo: 0.15
  gray_hi: 0.85
  max_gray_frac: 0.25
  erode_px: 15
  entropy_high: 0.5
  # 0.05 sat on the fence for 64010c19 (0.0499 vs 0.0500 between runs); furniture cases score 0.07–0.08 but fail on Dice.
  max_interior_entropy_frac: 0.08
  min_dice: 0.85
  prefer_peers: true
  min_peer_agree: 0.85
  peer_better_margin: 0.02
  overinclude_contain: 0.90
  overinclude_extra: 0.10
  min_keep_of_isnet: 0.50
  peer_recover_px: 12
  peer_island_px: 200
  retry_hopeless_gap: 0.05
  peers:
    - toonout
    - modnet

inpaint:
  name: auto
  small_hole_backend: lama
  small_hole_max_px: 4096
  seam_dilate_px: 2
  crop_pad_px: 32

compose:
  name: reproject_v1

paths:
  model_root: model
  sam2_dir: model/sam2
  sam3_dir: model/sam3
  aniseg_dir: model/aniseg
  anime_segmentation_dir: model/aniseg
  dwpose_dir: model/dwpose
  toonout_dir: model/toonout
  modnet_dir: model/modnet
  wdtagger_dir: model/wdtagger
  dino_dir: model/grounding_dino
  lama_dir: model/lama
  sd15_dir: model/sd15
  depth_anything_dir: model/depth_anything_base
  depth_anything_model: depth-anything/Depth-Anything-V2-Base-hf
  anime_parse_dir: model/anime_parse

export:
  psd: false
  steps: true

refine:
  min_area: 64
  mutex: true
  overlay_iou: 0.5
  overlay_contain: 0.75
  residual_max_frac: 0.04
  seam_fill_px: 24
  morph_open_px: 2

occlusion:
  background_luma: 250

qa:
  diff_visible_only: true

require_cuda_for:
  - sd15.anime
  - sam2.hinted
  - cascade
  - grounding_dino
  - sam3.text
