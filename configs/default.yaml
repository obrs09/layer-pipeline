schema: layerforge.config.v1

normalize:
  max_side: 2048

segment:
  name: auto

cascade:
  max_attempts: 4
  character: aniseg
  tagger: wdtagger
  boxes: grounding_dino
  mask: sam3.text
  mask_fallback: sam2.hinted
  dino_threshold: 0.25
  tag_threshold: 0.35

inpaint:
  name: auto
  small_hole_backend: lama
  small_hole_max_px: 4096
  seam_dilate_px: 2
  crop_pad_px: 32

compose:
  name: reproject_v1

paths:
  model_root: model
  sam2_dir: model/sam2
  sam3_dir: model/sam3
  aniseg_dir: model/aniseg
  wdtagger_dir: model/wdtagger
  dino_dir: model/grounding_dino
  lama_dir: model/lama
  sd15_dir: model/sd15

export:
  psd: false

refine:
  min_area: 64
  mutex: true
  overlay_iou: 0.5
  overlay_contain: 0.75
  residual_max_frac: 0.04
  seam_fill_px: 24

occlusion:
  background_luma: 250

qa:
  diff_visible_only: true

require_cuda_for:
  - sd15.anime
  - sam2.hinted
  - cascade
  - grounding_dino
  - sam3.text
