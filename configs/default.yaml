schema: layerforge.config.v1

normalize:
  max_side: 2048

segment:
  name: auto

inpaint:
  name: auto
  small_hole_backend: lama
  small_hole_max_px: 4096
  seam_dilate_px: 2
  crop_pad_px: 32

compose:
  name: reproject_v1

paths:
  model_root: model
  sam2_dir: model/sam2
  lama_dir: model/lama
  sd15_dir: model/sd15

export:
  psd: false

refine:
  min_area: 64
  mutex: true
  overlay_iou: 0.5
  overlay_contain: 0.75

occlusion:
  background_luma: 250

qa:
  diff_visible_only: true

require_cuda_for:
  - sd15.anime
  - sam2.hinted
