schema: layerforge.config.v1

normalize:
  max_side: 2048

segment:
  name: auto

cascade:
  max_attempts: 4
  character: anime_segmentation
  pose: dwpose
  pose_score: 0.3
  pose_dilate_px: 72
  tagger: wdtagger
  boxes: grounding_dino
  mask: sam3.text
  mask_fallback: sam2.hinted
  dino_threshold: 0.25
  tag_threshold: 0.35
  character_size: 1024

character_qa:
  max_attempts: 3
  min_largest_frac: 0.60
  max_components: 15
  min_component_px: 50
  gray_lo: 0.15
  gray_hi: 0.85
  max_gray_frac: 0.25
  erode_px: 15
  entropy_high: 0.5
  max_interior_entropy_frac: 0.05
  min_dice: 0.85
  peers:
    - toonout
    - modnet

inpaint:
  name: auto
  small_hole_backend: lama
  small_hole_max_px: 4096
  seam_dilate_px: 2
  crop_pad_px: 32

compose:
  name: reproject_v1

paths:
  model_root: model
  sam2_dir: model/sam2
  sam3_dir: model/sam3
  aniseg_dir: model/aniseg
  anime_segmentation_dir: model/aniseg
  dwpose_dir: model/dwpose
  toonout_dir: model/toonout
  modnet_dir: model/modnet
  wdtagger_dir: model/wdtagger
  dino_dir: model/grounding_dino
  lama_dir: model/lama
  sd15_dir: model/sd15

export:
  psd: false
  steps: true

refine:
  min_area: 64
  mutex: true
  overlay_iou: 0.5
  overlay_contain: 0.75
  residual_max_frac: 0.04
  seam_fill_px: 24
  morph_open_px: 2

occlusion:
  background_luma: 250

qa:
  diff_visible_only: true

require_cuda_for:
  - sd15.anime
  - sam2.hinted
  - cascade
  - grounding_dino
  - sam3.text
